name: Frontend CI

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const audit = require("./npm-audit.json"); console.log("Dependency vulnerabilities:", JSON.stringify(audit.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(audit.vulnerabilities || {})) console.log(name, item.severity, "fixAvailable:", JSON.stringify(item.fixAvailable));'
      - run: npm run build
